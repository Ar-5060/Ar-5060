<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a78bfa" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
    <clipPath id="c1"><rect x="60" y="88" height="40" width="0"><animate attributeName="width" values="0;0;420" keyTimes="0;.2;1" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="130" height="60" width="0"><animate attributeName="width" values="0;0;900" keyTimes="0;.55;1" dur="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="196" height="40" width="0"><animate attributeName="width" values="0;0;520" keyTimes="0;.7;1" dur="3.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="60" y="236" height="40" width="0"><animate attributeName="width" values="0;0;1000" keyTimes="0;.75;1" dur="4.8s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .prompt{fill:#7d8590;font-size:20px}
    .accent{fill:#a78bfa}
    .name{fill:#f0f6fc;font-size:48px;font-weight:700;font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-.5px}
    .out{fill:#c9d1d9;font-size:20px}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0d1117"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <circle cx="36" cy="32" r="6" fill="#ff5f57"/><circle cx="56" cy="32" r="6" fill="#febc2e"/><circle cx="76" cy="32" r="6" fill="#28c840"/>
    <text x="600" y="38" text-anchor="middle" class="mono" fill="#7d8590" font-size="14">anis@github: ~</text>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#30363d"/>
    <g clip-path="url(#c1)"><text x="60" y="116" class="mono prompt"><tspan class="accent">~</tspan> $ whoami</text></g>
    <g clip-path="url(#c2)"><text x="60" y="174" class="name">Anisur Rahman<tspan fill="#a78bfa">.</tspan></text></g>
    <g clip-path="url(#c3)"><text x="60" y="224" class="mono prompt"><tspan class="accent">~</tspan> $ cat focus.txt</text></g>
    <g clip-path="url(#c4)"><text x="60" y="262" class="mono out">Full-stack web with Spring Boot &amp; React · Applied machine learning <tspan fill="#a78bfa">█<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></tspan></text></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="14" fill="none" stroke="#30363d"/>
</svg>
