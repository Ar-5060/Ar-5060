<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset="0.5" stop-color="#302b63"/><stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .wave1{animation:w 9s ease-in-out infinite alternate}
    .wave2{animation:w 6s ease-in-out infinite alternate-reverse}
    @keyframes w{from{transform:translateX(0)}to{transform:translateX(-120px)}}
    .title{font:800 62px 'Segoe UI',Verdana,sans-serif;fill:url(#txt);animation:fade 1.4s ease-out .2s both}
    .sub{font:500 21px 'Segoe UI',Verdana,sans-serif;fill:#ddd6fe;letter-spacing:1px;animation:fade 1.4s ease-out .9s both}
    @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .dot{fill:#a78bfa;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle class="dot" cx="90" cy="50" r="2.5"/><circle class="dot" cx="260" cy="30" r="2" style="animation-delay:1s"/>
    <circle class="dot" cx="980" cy="45" r="2.5" style="animation-delay:.5s"/><circle class="dot" cx="1110" cy="90" r="2" style="animation-delay:1.6s"/>
    <circle class="dot" cx="560" cy="25" r="2" style="animation-delay:2.2s"/><circle class="dot" cx="760" cy="60" r="1.8" style="animation-delay:1.2s"/>
    <path class="wave1" fill="#7c3aed" opacity=".25" d="M0 205 Q 75 175 150 205 T 300 205 T 450 205 T 600 205 T 750 205 T 900 205 T 1050 205 T 1200 205 T 1350 205 V260 H0Z"/>
    <path class="wave2" fill="#a78bfa" opacity=".18" d="M0 222 Q 100 195 200 222 T 400 222 T 600 222 T 800 222 T 1000 222 T 1200 222 T 1400 222 V260 H0Z"/>
    <text class="title" x="600" y="118" text-anchor="middle">Hi, I'm Anis</text>
    <text class="sub" x="600" y="162" text-anchor="middle">Full-Stack Developer  •  Java &amp; Spring Boot  •  React  •  ML Enthusiast</text>
  </g>
</svg>
